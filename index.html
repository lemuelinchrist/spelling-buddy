@font-face{font-family:"Fredoka";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/fredoka-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/nunito-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/nunito-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/nunito-latin-700-normal.woff2") format("woff2")}

<body>
<style>
/* Layout: one phone-width column, four screens swapped in place, bottom tab bar; practice runs full-screen */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EEF2FA; --line:#D5DCE6;
  --fg:#1B2A41; --muted:#4B5768;
  --blue:#1D4ED8; --blue-soft:#E6EDFC;
  --orange:#C2410C; --orange-ink:#9A3412; --orange-soft:#FFF1E6;
  --on-accent:#FFFFFF; --shadow:rgba(27,42,65,.08);
  --display:"Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1623; --surface:#182131; --surface-2:#1F2A3D; --line:#2E3B52;
  --fg:#E8EDF5; --muted:#A3AEC0;
  --blue:#8CB0FF; --blue-soft:#1C2A4A;
  --orange:#F08A4B; --orange-ink:#FFB98A; --orange-soft:#3A2416;
  --on-accent:#10151F; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1623; --surface:#182131; --surface-2:#1F2A3D; --line:#2E3B52;
  --fg:#E8EDF5; --muted:#A3AEC0;
  --blue:#8CB0FF; --blue-soft:#1C2A4A;
  --orange:#F08A4B; --orange-ink:#FFB98A; --orange-soft:#3A2416;
  --on-accent:#10151F; --shadow:rgba(0,0,0,.35); color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:20px 112px}
.app.full{padding-bottom:28px}
.screen{display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:18px;font-family:var(--body);font-weight:800}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.pill.streak{background:var(--orange-soft);color:var(--orange-ink)}
.btn{min-height:52px;border-radius:16px;border:none;padding:0 18px;font-weight:800;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--orange);color:var(--on-accent)}
.btn.blue{background:var(--blue);color:var(--on-accent)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.btn.text{background:transparent;color:var(--muted);font-weight:700}
.btn.small{min-height:44px;font-size:15px;border-radius:999px;padding:0 14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Home */
.hero{background:var(--orange);color:var(--on-accent);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero .big{font-family:var(--display);font-size:42px;font-weight:600;line-height:1}
.hero .chip{background:color-mix(in srgb, var(--on-accent) 18%, transparent);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.hero .btn{background:var(--surface);color:var(--fg)}
.hero.done{background:var(--blue)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:32px;height:32px;border-radius:50%;background:var(--surface-2)}
.dot.on{background:var(--blue)}
.dot.today{border:2px dashed var(--orange);background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.wchip{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}

/* Practice */
.topbar{display:flex;align-items:center;gap:14px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.bar{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width .3s}
.speak{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:8px}
.play{width:124px;height:124px;border-radius:50%;border:none;background:var(--blue);color:var(--on-accent);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb, var(--blue) 30%, transparent)}
.play svg{width:54px;height:54px}
.play:active{transform:scale(.96)}
.sentence{background:var(--surface);border-radius:18px;padding:16px 18px;font-size:17px}
.blank{display:inline-block;min-width:88px;border-bottom:2.5px solid var(--fg);vertical-align:baseline;height:1em}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:800;font-size:15px}
.spell{height:64px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface);padding:0 18px;font-family:var(--display);font-size:28px;letter-spacing:.05em;width:100%}
.spell:focus{border-color:var(--blue);outline:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-weight:700;color:var(--orange-ink)}
.lookword{font-family:var(--display);font-size:44px;font-weight:600;text-align:center;letter-spacing:.04em;color:var(--blue);padding:18px 0}
.result-ok{background:var(--blue-soft);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.result-ok .word{font-family:var(--display);font-size:34px;font-weight:600;color:var(--blue)}
.tiles{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--display);font-size:22px;font-weight:500}
.tile{min-width:28px;height:40px;padding:0 4px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.tile.bad{background:var(--orange-soft);color:var(--orange-ink);outline:2px solid var(--orange)}
.tile.extra{background:var(--orange-soft);color:var(--orange-ink);text-decoration:line-through;text-decoration-thickness:2.5px;outline:2px solid var(--orange)}
.tile.missing{background:transparent;outline:2px dashed var(--orange);color:var(--orange-ink);font-size:16px}
.correct{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:.04em;color:var(--blue);word-break:break-word}
.correct u{text-decoration-thickness:3px;text-underline-offset:6px}
.tip{background:var(--surface-2);border-radius:20px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.tip svg{width:26px;height:26px;stroke:var(--blue)}
.grow{flex:1}

/* Lists & settings */
details.list{background:var(--surface);border-radius:18px}
details.list>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
details.list>summary::-webkit-details-marker{display:none}
.lname{font-weight:800}
.lcount{color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--blue);border-radius:999px}
.lbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.wordrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--surface-2)}
.wordrow span:first-child{font-weight:700;min-width:0;overflow-wrap:anywhere}
.status{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.s-new{background:var(--surface-2);color:var(--muted)}
.s-learning{background:var(--surface-2);color:var(--fg)}
.s-tricky{background:var(--orange-soft);color:var(--orange-ink)}
.s-mastered{background:var(--blue-soft);color:var(--blue)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--blue)}
textarea,.txt,select{border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:10px 14px;width:100%}
textarea{resize:vertical;min-height:110px;font-size:16px}
.txt,select{min-height:48px}
.confirm{background:var(--orange-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:90%}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.chart .b{width:100%;background:color-mix(in srgb, var(--blue) 35%, var(--surface-2));border-radius:8px;min-height:4px}
.chart .col.now .b{background:var(--blue)}
.chart .v{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .col.now .v{color:var(--blue)}
.chart .l{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--surface-2)}
.prow:first-child{border-top:none;padding-top:0}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;
  padding:6px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.tabs button{min-height:54px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--orange);font-weight:800}
nav.tabs svg.i{width:22px;height:22px}
/* Install banner: drops in at the top on a visit from the browser, leaves by itself */
.install{position:fixed;left:0;right:0;top:0;z-index:30;
  padding:calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  transform:translateY(-110%);transition:transform .35s ease;pointer-events:none}
.install.show{transform:none}
.install .in{pointer-events:auto;max-width:480px;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
  box-shadow:0 12px 32px var(--shadow);padding:14px 14px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.install .top{display:flex;align-items:center;gap:12px}
.install img{width:48px;height:48px;border-radius:12px;flex-shrink:0}
.install .txt-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.install b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2}
.install .sub{font-size:14px;color:var(--muted);line-height:1.35}
.install .iconbtn{background:var(--surface-2);width:40px;height:40px}
.install .steps{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
.install .steps span{display:flex;align-items:center;gap:8px}
.install .steps svg.i{color:var(--blue)}
.install .actions{display:flex;justify-content:flex-end}
.install .timer{height:4px;background:var(--surface-2);margin:0 -14px}
.install .timer>span{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left;transform:scaleX(1)}
.install.counting .timer>span{transform:scaleX(0);transition:transform linear var(--install-ms, 15s)}
.install.paused .timer>span{transform:scaleX(1);transition:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <section class="screen" id="home"></section>
  <section class="screen" id="practice" hidden></section>
  <section class="screen" id="words" hidden></section>
  <section class="screen" id="progress" hidden></section>
</div>

<nav class="tabs" id="tabs" aria-label="Main">
  <div class="in">

    <button type="button" data-go="start"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>Practise</button>
    <button type="button" data-go="words"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>Words</button>
    <button type="button" data-go="progress"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Progress</button>
  </div>
</nav>

<div class="install" id="install" role="dialog" aria-labelledby="install-title" aria-describedby="install-sub" hidden>
  <div class="in">
    <div class="top">
      <img src="icons/icon-192.png" alt="">
      <div class="txt-wrap"><b id="install-title">Install Spelling Buddy</b><span class="sub" id="install-sub">Put it on your home screen. It works with no internet.</span></div>

    </div>

      <span>1. Tap <svg class="i" viewBox="0 0 24 24" aria-label="Share"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg> Share</span>
      <span>2. Choose “Add to Home Screen”</span>
    </div>
    <div class="actions" id="install-actions" hidden><button class="btn small primary" type="button" id="install-go">Install</button></div>
    <div class="timer" aria-hidden="true"><span></span></div>
  </div>
</div>

<script>
/* ---------- Word bank ----------
   PSLE has no official spelling list; spelling is tested in Paper 2 Editing.
   This bank holds answers from past PSLE editing questions plus words P5–P6
   pupils commonly misspell, grouped by the trap they set. British spelling throughout.
   Line format: word|example sentence with _ for the word|memory tip (optional) */
const RAW_BANK = [
{id:"psle", name:"Past PSLE editing answers", lines:`
immediately|The fire alarm rang and we left the hall _.|immedi-ATE-ly: keep the "ate" in the middle.
contagious|Chickenpox is _, so Wei Ling had to stay at home.|
fluid|The nurse told him to drink plenty of _.|
scratching|The puppy kept _ at the door to be let in.|Scratch keeps its "t" before "ch".
recuperate|After the operation, Grandpa needed a week to _.|
lethargic|The heat made everyone feel _ and sleepy.|`},
{id:"double", name:"Double letters", lines:`
necessary|It is _ to wear a helmet when you cycle.|A shirt has one Collar and two Sleeves.
unnecessary|Bringing three umbrellas was _.|un + necessary: the double "n" comes from adding "un".
embarrass|Please do not _ me in front of my friends.|Two r's and two s's: you go Really Red and Smile Shyly.
accommodate|The hall can _ five hundred pupils.|It is big enough to hold two c's and two m's.
occasion|The school concert was a special _.|Two c's, one s.
address|Write your _ clearly on the envelope.|
tomorrow|The test is _, so I will revise tonight.|One m, two r's.
disappear|The magician made the rabbit _.|dis + appear: one s, two p's.
disappoint|I did not want to _ my coach.|dis + appoint: one s, two p's.
possession|The wallet was found in his _.|Two pairs of s's.
recommend|Can you _ a good book to read?|One c, two m's.
committee|The class _ planned the party.|Double m, double t, double e.
millionaire|The _ gave money to the hospital.|Two l's, but only one n.
success|Our charity sale was a great _.|Two c's, two s's.
successful|The rescue mission was _.|success + ful: "full" drops an l.
beginning|At the _ of the year, we set our goals.|Double the n before "ing".
occurred|The accident _ near the junction.|Two c's and two r's.
travelled|We _ to Malacca by coach.|British spelling doubles the l.
cancelled|The match was _ because of the rain.|British spelling doubles the l.
opportunity|This trip is a great _ to learn.|Two p's after the o.
aggressive|The _ dog barked at everyone.|Two g's, two s's.
exaggerate|Don't _; it was only a small spider!|Two g's, one r.
collapse|The old bridge might _ in a storm.|
commotion|There was a _ when the snake appeared.|
appreciate|I _ your help with my project.|
assistance|The old lady needed _ with her bags.|
accident|It was an _, so please don't be angry.|
accurate|Make sure your measurements are _.|
approach|We watched the storm clouds _ the island.|
suggestion|Do you have a _ for the class outing?|
harass|It is wrong to _ stray animals.|Only one r, but two s's.
apparently|_, the shop has closed for good.|Two p's, then "rent": app-a-rent-ly.
occurrence|Lightning is a common _ here.|Double c, double r.`},
{id:"silent", name:"Silent letters", lines:`
rhythm|We clapped to the _ of the drums.|Rhythm Helps Your Two Hips Move.
conscience|My _ told me to return the money.|con + science.
conscious|He was _ that everyone was watching.|There's a hidden "sc".
knowledge|Reading widens your _.|know + ledge.
knuckle|She grazed her _ on the wall.|
wrinkle|Iron the shirt to remove every _.|
wrestle|The boys like to _ on the grass.|
scissors|Pass me the _ to cut the paper.|A silent c, and two s's at the end.
muscle|He pulled a _ while running.|Silent c after the s.
guarantee|The watch comes with a two-year _.|A silent u after the g.
guardian|Please get your form signed by a parent or _.|
honest|Thank you for being _ with me.|Silent h.
honour|It is an _ to lead the school band.|Silent h, and British "our".
island|Sentosa is a small _ off Singapore.|An island IS LAND.
thumb|I hurt my _ playing volleyball.|Silent b.
plumber|The _ fixed the leaking pipe.|Silent b.
solemn|The ceremony was quiet and _.|Silent n at the end.
column|Write your answers in the second _.|Silent n at the end.
autumn|Leaves fall from the trees in _.|Silent n at the end.
doubt|I have no _ that she will win.|Silent b.
debt|He worked hard to pay off his _.|Silent b.
receipt|Keep the _ in case you need to return it.|Silent p.
foreign|She speaks two _ languages.|
whistle|The referee blew the _.|Silent t.
glisten|Dew drops _ in the morning sun.|Silent t.
design|We had to _ a poster for Racial Harmony Day.|Silent g.
campaign|The school started a _ to save water.|`},
{id:"ie", name:"ie or ei", lines:`
receive|Did you _ my message?|i before e, except after c.
believe|I _ you can do it.|Never beLIEve a LIE.

/* ---------- Storage ---------- */
const KEY = "spellbuddy.v1";
const INTERVALS = [1, 1, 3, 7, 14, 30]; // days until next review, by box
const MASTERED_BOX = 4;
function freshState(){ return { v:1, goal:10, mode:"listen", voice:"", off:{}, custom:[], cards:{}, log:{} }; }
let S = freshState();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(freshState(), JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const k = w => w.toLowerCase();
function dayKey(d = new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(key, n){ const [y,m,d] = key.split("-").map(Number); return dayKey(new Date(y, m-1, d+n)); }
function fromKey(key){ const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); }
const today = () => dayKey();
const ICON = {

  close:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bulb:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>',

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- Word lists ---------- */
function allLists(){ return [...S.custom.map(c => ({...c, builtin:false})), ...BANK]; }
function isOn(list){ return list.builtin ? !S.off[list.id] : list.on !== false; }
function activeWords(){
  const seen = new Set(), out = [];
  for (const l of allLists()) { if (!isOn(l)) continue;
    for (const w of l.words) { const key = k(w.w); if (seen.has(key)) continue; seen.add(key); out.push({...w, list:l.name}); } }
  return out;
}
function statusOf(w){
  const c = S.cards[k(w)];
  if (!c) return ["New","s-new"];
  if (c.box >= MASTERED_BOX) return ["Mastered","s-mastered"];
  if (c.wrong >= 2) return ["Tricky","s-tricky"];
  return ["Learning","s-learning"];
}

/* ---------- Daily plan ---------- */
function todaysLog(){ return S.log[today()] || {done:0, first:0, fresh:0}; }
function plan(extra){
  const t = today(), words = activeWords();
  const due = words.filter(w => { const c = S.cards[k(w.w)]; return c && c.due <= t; })
                   .sort((a,b) => S.cards[k(a.w)].due.localeCompare(S.cards[k(b.w)].due));
  const fresh = words.filter(w => !S.cards[k(w.w)]);
  if (extra) {
    if (fresh.length) return fresh.slice(0, extra);
    return words.filter(w => S.cards[k(w.w)].box < MASTERED_BOX).sort((a,b) => S.cards[k(b.w)].wrong - S.cards[k(a.w)].wrong).slice(0, extra);
  }
  const reviews = due.slice(0, 20);
  const room = Math.max(0, S.goal - todaysLog().done - reviews.length);
  return [...reviews, ...fresh.slice(0, room)];
}
function streak(){
  let d = today(); if (!(S.log[d] && S.log[d].done)) d = addDays(d, -1);
  let n = 0; while (S.log[d] && S.log[d].done) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- Speech ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let voices = [];
function loadVoices(){ if (!canSpeak) return; voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); if (!$("#words").hidden) renderWords(); }
if (canSpeak) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  if (S.voice) { const v = voices.find(v => v.name === S.voice); if (v) return v; }
  for (const pref of ["en-GB","en-SG","en-AU","en-IE","en-NZ","en-IN","en-US"]) { const v = voices.find(v => v.lang.replace("_","-").toLowerCase() === pref.toLowerCase()); if (v) return v; }
  return voices[0] || null;
}
function say(text, rate = 0.9){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB"; u.rate = rate; speechSynthesis.speak(u); } catch(e) {}
}
const fullSentence = w => w.s ? w.s.replace(/_/g, w.w) : "";

/* ---------- Spelling comparison ---------- */
function align(attempt, correct){
  const a = attempt.toLowerCase(), b = correct.toLowerCase(), n = a.length, m = b.length;
  const D = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=0;i<=n;i++) D[i][0]=i; for (let j=0;j<=m;j++) D[0][j]=j;
  for (let i=1;i<=n;i++) for (let j=1;j<=m;j++)
    D[i][j] = Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  const ops = []; let i=n, j=m;
  while (i>0 || j>0) {
    if (i>0 && j>0 && D[i][j] === D[i-1][j-1] + (a[i-1]===b[j-1]?0:1)) { ops.push({t: a[i-1]===b[j-1]?"same":"sub", a:attempt[i-1], bi:j-1}); i--; j--; }
    else if (i>0 && D[i][j] === D[i-1][j]+1) { ops.push({t:"extra", a:attempt[i-1]}); i--; }
    else { ops.push({t:"missing", bi:j-1}); j--; }
  }
  return ops.reverse();
}
function describe(ops){
  const extra = ops.filter(o=>o.t==="extra").length, miss = ops.filter(o=>o.t==="missing").length, sub = ops.filter(o=>o.t==="sub").length, total = extra+miss+sub;
  if (total === 1) return extra ? "One letter too many." : miss ? "One letter is missing." : "One letter is wrong.";
  if (total === 2 && sub === 2) return "Two letters are swapped or wrong.";
  return total + " letters to fix.";
}

/* ---------- Recording results ---------- */
function record(item, result){ // result: right | help | wrong
  const key = k(item.w), t = today(), isNew = !S.cards[key];
  const c = S.cards[key] || {box:0, right:0, wrong:0, list:item.list};
  c.list = item.list;
  if (result === "right") { c.box = Math.min(c.box + 1, INTERVALS.length - 1); c.right++; }
  else if (result === "help") { c.right++; }
  else { c.box = 0; c.wrong++; c.lastMiss = t; }
  c.due = addDays(t, result === "right" ? INTERVALS[c.box] : 1);
  S.cards[key] = c;
  const L = S.log[t] || (S.log[t] = {done:0, first:0, fresh:0});
  L.done++; if (result === "right") L.first++; if (isNew) L.fresh++;
  save();
}

/* ---------- Navigation ---------- */
const screens = ["home","practice","words","progress"];
function show(name){
  screens.forEach(s => $("#"+s).hidden = s !== name);
  const inPractice = name === "practice";
  $("#tabs").hidden = inPractice; $("#app").classList.toggle("full", inPractice);
  document.querySelectorAll("#tabs button").forEach(b => { if (b.dataset.go === name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (reloadWhenIdle && name !== "practice") { location.reload(); return; }
  ({home:renderHome, words:renderWords, progress:renderProgress})[name]?.();
  window.scrollTo(0,0);
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; b.dataset.go === "start" ? startSession() : show(b.dataset.go); });

/* ---------- Home ---------- */
function renderHome(){
  const p = plan(), L = todaysLog(), st = streak(), now = new Date();
  const dateStr = now.toLocaleDateString("en-SG", {weekday:"long", day:"numeric", month:"short"});
  const reviews = p.filter(w => S.cards[k(w.w)]).length, fresh = p.length - reviews;
  const firstList = allLists().find(l => isOn(l));

  const tricky = Object.entries(S.cards).filter(([,c]) => c.wrong > 0 && c.box < MASTERED_BOX).sort((a,b) => b[1].wrong - a[1].wrong).slice(0,6);

      <div class="big">All done!</div>
      <span>${L.done ? `You practised ${L.done} word${L.done>1?"s":""} today. Words you missed will come back tomorrow.` : "No words are due. Turn on a word list in Words to keep going."}</span>
      <button class="btn block" type="button" id="more">Practise 5 more</button>
    </div>`;
  $("#home").innerHTML = `
    <div class="row between">
      <div><div class="muted" style="font-weight:600;font-size:15px">${esc(dateStr)}</div><h1>Spelling Buddy</h1></div>

  $("#go")?.addEventListener("click", () => startSession());
  $("#more")?.addEventListener("click", () => startSession(5));
}

/* ---------- Practice ---------- */
let P = null;
function startSession(extra){
  const q = plan(extra);
  if (!q.length) { toast(activeWords().length ? "Nothing left to practise right now." : "Turn on a word list first."); show("words"); return; }
  P = { queue: q.map(w => ({...w, again:false})), i:0, firstRight:0, firstTotal:q.length, missed:[] };
  show("practice"); nextWord(true);
}
function nextWord(first){
  if (!first) P.i++;
  if (P.i >= P.queue.length) return renderSummary();
  const it = P.queue[P.i];
  P.cur = { it, hint:false, phase: S.mode === "look" || !canSpeak ? "look" : "ask", attempt:"" };
  renderPractice();
  if (P.cur.phase === "ask") setTimeout(() => say(it.w), 250);
}
function practiceTop(){
  const pct = Math.round(P.i / P.queue.length * 100);

    <span style="font-weight:800;font-size:15px;font-variant-numeric:tabular-nums">${Math.min(P.i+1, P.queue.length)}/${P.queue.length}</span></div>`;
}

      <div class="result-ok" role="status"><span class="eyebrow" style="color:var(--blue)">Correct</span><span class="word">${esc(it.w)}</span><span>${msg}</span></div>

      <button class="btn primary block" type="button" id="next">Next word</button>`;
  } else if (c.phase === "wrong" || c.phase === "rewrite") {

    const fix = new Set(ops.filter(o => o.t==="sub" || o.t==="missing").map(o => o.bi));
    const corr = [...it.w].map((ch,i) => fix.has(i) ? `<u>${esc(ch)}</u>` : esc(ch)).join("");
    if (c.phase === "wrong") {
      body = `
        <div><h1 style="font-size:28px">${ops.filter(o=>o.t!=="same").length <= 1 ? "So close!" : "Not quite."}</h1><p class="muted" style="margin:4px 0 0">${describe(ops)} Let's fix it together.</p></div>
        <div class="card">

          <span class="eyebrow">Correct spelling</span><div class="correct">${corr}</div>

        </div>

        <button class="btn primary block" type="button" id="cover">Cover it and write it again</button>`;
    } else {
      body = `
        <div><h1 style="font-size:28px">Now from memory</h1><p class="muted" style="margin:4px 0 0">The word is covered. Write it the right way.</p></div>
        ${it.t ? tipCard(it.t) : ""}
        <form class="field" id="f" autocomplete="off">
          <label for="spell-input">Write it again</label>

    }

      <div class="result-ok" role="status"><span class="eyebrow" style="color:var(--blue)">Fixed it</span><span class="word">${esc(it.w)}</span>
      <span>${it.again ? "Good. It will come back tomorrow." : "Well done. It will come back at the end of this round, and again tomorrow."}</span></div>
      <div class="grow"></div>
      <button class="btn primary block" type="button" id="next">Next word</button>`;
  }
  el.innerHTML = practiceTop() + body;
  el.style.minHeight = "calc(100dvh - 48px)";
  $("#quit").onclick = () => { if (canSpeak) speechSynthesis.cancel(); P = null; show("home"); };
  $("#hear") && ($("#hear").onclick = () => say(it.w));
  $("#slow") && ($("#slow").onclick = () => say(it.w, 0.5));
  $("#sent") && ($("#sent").onclick = () => say(fullSentence(it), 0.85));
  $("#hint") && ($("#hint").onclick = () => { c.hint = true; renderPractice(); });
  $("#cover") && ($("#cover").onclick = () => { c.phase = c.phase === "look" ? "write" : "rewrite"; renderPractice(); });
  $("#peek") && ($("#peek").onclick = () => { c.phase = "wrong"; renderPractice(); });
  $("#next") && ($("#next").onclick = () => nextWord(false));
  const f = $("#f"); if (f) { f.onsubmit = e => { e.preventDefault(); check(); }; setTimeout(() => $("#spell-input")?.focus(), 50); }
  $("#next")?.focus();
}
function tipCard(t){ return `<div class="tip">${ICON.bulb}<div><div style="font-weight:800;font-size:15px">Memory trick</div><div>${esc(t)}</div></div></div>`; }
function check(){
  const c = P.cur, it = c.it, input = $("#spell-input"), ans = input.value.trim();
  if (!ans) { input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake"); return; }
  const ok = ans.toLowerCase() === it.w.toLowerCase();
  if (c.phase === "rewrite") {
    if (ok) { c.phase = "fixed"; renderPractice(); }
    else { c.attempt = ans; c.phase = "wrong"; renderPractice(); toast("Not yet. Look at it once more."); }
    return;
  }
  // ask or write
  if (ok) {
    if (!it.again) { record(it, c.hint ? "help" : "right"); if (!c.hint) P.firstRight++; }
    c.phase = "right"; renderPractice(); if (!c.hint && !it.again) say("Correct!", 1);
  } else {
    if (!it.again) { record(it, "wrong"); P.missed.push(it.w); P.queue.push({...it, again:true}); }
    c.attempt = ans; c.phase = "wrong"; renderPractice();
  }
}

/* ---------- Backup: move progress between devices ----------
   The code is the whole saved state, JSON → base64, with a prefix.
   Restoring MERGES into this device, so nothing she did here is lost:
   for each word the record with more attempts wins, for each day the bigger log wins,
   and her own lists are combined. */
const BACKUP_PREFIX = "SPELLBUDDY1:";
let bkDraft = "", bkShown = false;
function backupCode(){
  const bytes = new TextEncoder().encode(JSON.stringify(S));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return BACKUP_PREFIX + btoa(bin);
}
function readBackup(text){
  const raw = String(text).replace(/\s+/g, "");
  if (!raw.startsWith(BACKUP_PREFIX)) throw new Error("prefix");
  const bin = atob(raw.slice(BACKUP_PREFIX.length));
  const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  if (!data || typeof data !== "object" || typeof data.cards !== "object" || typeof data.log !== "object") throw new Error("shape");
  return data;
}
function mergeBackup(data){
  const attempts = c => (c && (c.right || 0) + (c.wrong || 0)) || 0;
  const freshDevice = !Object.keys(S.cards).length;
  let words = 0;
  for (const [key, c] of Object.entries(data.cards || {})) {
    if (attempts(c) > attempts(S.cards[key])) { S.cards[key] = c; words++; }
  }
  for (const [day, L] of Object.entries(data.log || {})) {
    if (!S.log[day] || (L && L.done > S.log[day].done)) S.log[day] = L;
  }
  const have = new Set(S.custom.map(c => c.id));
  for (const c of (data.custom || [])) if (c && c.id && !have.has(c.id)) S.custom.push(c);
  for (const id of Object.keys(data.off || {})) S.off[id] = true;
  if (freshDevice) { // a brand-new install takes over her settings too
    if ([5,10,15,20].includes(data.goal)) S.goal = data.goal;
    if (data.mode === "listen" || data.mode === "look") S.mode = data.mode;
  }
  save();
  return words;
}
function backupCard(){
  return `<div class="card" id="backup"><h2>Move progress to another device</h2>
    <p class="note" style="margin:0">Copy the backup code on this device, then paste it into Spelling Buddy on the other one. It carries her streak, word progress and her own lists.</p>
    <button class="btn small ghost" type="button" id="bk-copy" style="align-self:flex-start">Copy backup code</button>
    <div class="field" ${bkShown ? "" : "hidden"} id="bk-out-wrap"><label for="bk-out">Backup code</label>
      <textarea id="bk-out" readonly style="min-height:80px;font-size:13px;word-break:break-all"></textarea>
      <span class="note">If copying didn't work, press and hold the box, then choose Select All and Copy.</span></div>
    <div class="field"><label for="bk-in">Paste a backup code</label>
      <textarea id="bk-in" style="min-height:80px;font-size:13px;word-break:break-all" placeholder="${BACKUP_PREFIX}…">${esc(bkDraft)}</textarea></div>
    <button class="btn small primary" type="button" id="bk-restore" style="align-self:flex-start">Restore progress</button>
    <p class="note" style="margin:0">Restoring adds the backup to what's already here. Nothing on this device is erased.</p>
  </div>`;
}
function wireBackup(){
  const out = $("#bk-out");
  if (bkShown && out) out.value = backupCode();
  $("#bk-copy").onclick = () => {
    const code = backupCode();
    bkShown = true; $("#bk-out-wrap").hidden = false; out.value = code;
    const fallback = () => { out.focus(); out.select(); toast("Code selected. Copy it to move her progress."); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast("Backup code copied."), fallback);
      else fallback();
    } catch(e) { fallback(); }
  };
  $("#bk-in").oninput = e => { bkDraft = e.target.value; };
  $("#bk-restore").onclick = () => {
    const input = $("#bk-in");
    if (!input.value.trim()) { toast("Paste a backup code first."); input.focus(); return; }
    let data;
    try { data = readBackup(input.value); }
    catch(e) { toast("That code didn't work. Copy the whole code and try again."); input.focus(); return; }
    const n = mergeBackup(data);
    bkDraft = ""; renderWords();
    toast(`Progress restored: ${n} word${n === 1 ? "" : "s"} updated, ${streak()}-day streak.`);
  };
}

/* ---------- Progress ---------- */
function renderProgress(){
  const cards = Object.entries(S.cards);
  const mastered = cards.filter(([,c]) => c.box >= MASTERED_BOX).length;
  const t = today(), now = fromKey(t), monday = addDays(t, -((now.getDay()+6)%7));
  const weeks = [];
  for (let w = 5; w >= 0; w--) {
    const start = addDays(monday, -7*w); let done = 0, first = 0;
    for (let d = 0; d < 7; d++) { const L = S.log[addDays(start, d)]; if (L) { done += L.done; first += L.first; } }
    weeks.push({ label: w === 0 ? "This wk" : fromKey(start).toLocaleDateString("en-SG", {day:"numeric", month:"short"}), pct: done ? Math.round(first/done*100) : null, now: w === 0 });
  }
  const hasData = weeks.some(w => w.pct !== null);
  const groups = {};
  cards.forEach(([key,c]) => { if (!c.wrong) return; const g = groups[c.list] || (groups[c.list] = {n:0, words:[]}); g.n += c.wrong; g.words.push([key, c.wrong]); });
  const names = Object.fromEntries(activeWords().map(w => [k(w.w), w.w]));
  const patterns = Object.entries(groups).sort((a,b) => b[1].n - a[1].n).slice(0,5);
  const practised = cards.length;
  $("#progress").innerHTML = `
    <h1 style="font-size:28px">Progress</h1>
    <div class="stats">
      <div class="stat"><b style="color:var(--blue)">${mastered}</b><span class="muted" style="font-weight:700;font-size:14px">words mastered</span></div>
      <div class="stat"><b style="color:var(--orange)">${streak()}</b><span class="muted" style="font-weight:700;font-size:14px">day streak</span></div>
      <div class="stat"><b>${practised}</b><span class="muted" style="font-weight:700;font-size:14px">words practised</span></div>
      <div class="stat"><b>${activeWords().length - practised}</b><span class="muted" style="font-weight:700;font-size:14px">still to start</span></div>
    </div>
    <div class="card">
      <div class="row between"><h2>Right first time</h2><span class="note">last 6 weeks</span></div>
      ${hasData ? `<div class="chart" role="img" aria-label="Share of words spelt right on the first try each week: ${weeks.map(w => `${w.label} ${w.pct ?? "no practice"}${w.pct!==null?"%":""}`).join(", ")}">
        ${weeks.map(w => `<div class="col ${w.now?"now":""}"><span class="v">${w.pct===null ? "–" : w.pct+"%"}</span><div class="b" style="height:${w.pct===null ? 0 : Math.max(4, w.pct)}%"></div><span class="l">${esc(w.label)}</span></div>`).join("")}
      </div>` : `<p class="note" style="margin:0">After her first round, this chart shows how often she spells words right on the first try each week.</p>`}
    </div>
    <div class="screen" style="gap:10px"><h2>Mistake patterns</h2>
      ${patterns.length ? `<div class="card" style="gap:0">${patterns.map(([g, v]) => `<div class="prow"><div style="min-width:0"><div style="font-weight:800">${esc(g)}</div><div class="note">${v.words.sort((a,b)=>b[1]-a[1]).slice(0,3).map(([key]) => esc(names[key] || key)).join(", ")}</div></div><span style="font-weight:800;color:var(--orange-ink);font-variant-numeric:tabular-nums">${v.n}×</span></div>`).join("")}</div>`
        : `<p class="note" style="margin:0">Once she misses a few words, this shows which kinds of spelling trip her up (double letters, silent letters and so on).</p>`}
    </div>`;
}


/* ---------- Install banner ----------
   Shown on each visit from a browser tab, never inside the installed app.
   Chrome/Edge/Samsung: one-tap Install via beforeinstallprompt.
   iPhone/iPad: no install API, so it shows the Share → Add to Home Screen steps.
   Leaves after 15 s (paused while touched); "Not now" hides it for 7 days. */
const INSTALL_KEY = "spellbuddy.installSnooze", INSTALL_MS = 15000;
let deferredInstall = null, installTimer = null, installShown = false;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installSnoozed(){ try { return Date.now() < +(localStorage.getItem(INSTALL_KEY) || 0); } catch(e) { return false; } }
function hideInstall(snooze){
  const el = $("#install"); clearTimeout(installTimer);
  el.classList.remove("show");
  setTimeout(() => { el.hidden = true; }, 400);
  if (snooze) { try { localStorage.setItem(INSTALL_KEY, String(Date.now() + 7*864e5)); } catch(e) {} }
}
function startInstallTimer(){
  const el = $("#install");
  el.style.setProperty("--install-ms", INSTALL_MS + "ms");
  el.classList.remove("counting", "paused"); void el.offsetWidth; el.classList.add("counting");
  clearTimeout(installTimer); installTimer = setTimeout(() => hideInstall(false), INSTALL_MS);
}
function showInstall(mode){ // "prompt" | "ios"
  if (installShown || isStandalone() || installSnoozed() || P) return;
  installShown = true;
  const el = $("#install");
  $("#install-actions").hidden = mode !== "prompt";
  $("#install-steps").hidden = mode !== "ios";
  el.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add("show"); startInstallTimer(); }));
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; setTimeout(() => showInstall("prompt"), 1200); });
window.addEventListener("appinstalled", () => { deferredInstall = null; hideInstall(false); toast("Installed. Open Spelling Buddy from your home screen."); });
if (isIOS) setTimeout(() => showInstall("ios"), 1200);
$("#install-close").onclick = () => hideInstall(true);
$("#install-go").onclick = () => {
  if (!deferredInstall) { hideInstall(false); return; }
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(() => { deferredInstall = null; hideInstall(false); });
};
// Hold the banner while she's touching or reading it; restart the countdown when she lets go.
$("#install").addEventListener("pointerenter", () => { clearTimeout(installTimer); $("#install").classList.add("paused"); });
$("#install").addEventListener("pointerdown", () => { clearTimeout(installTimer); $("#install").classList.add("paused"); });
$("#install").addEventListener("pointerleave", () => { if ($("#install").classList.contains("show")) startInstallTimer(); });

/* ---------- Offline + updates ----------
   sw.js keeps a copy of the app on the device. When a new version is published,
   the phone downloads it in the background the next time it's online and switches over
   at a calm moment (never in the middle of a practice round). */
let reloadWhenIdle = false;
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
if ("serviceWorker" in navigator) {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }   // first install: nothing to refresh
    if (P) reloadWhenIdle = true; else location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}

show("home");
</script>
